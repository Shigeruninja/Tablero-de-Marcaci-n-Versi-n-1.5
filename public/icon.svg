<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="scoreRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="scoreGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="scoreAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  
  <!-- Marco Exterior -->
  <rect x="24" y="24" width="464" height="464" rx="48" fill="url(#bg)" stroke="#334155" stroke-width="12"/>
  
  <!-- Pantalla Digital Superior (Reloj) -->
  <rect x="72" y="72" width="368" height="120" rx="20" fill="#000000" stroke="#1e293b" stroke-width="6"/>
  <text x="256" y="160" font-family="monospace" font-size="84" font-weight="900" fill="url(#scoreAmber)" text-anchor="middle" letter-spacing="4">10:00</text>
  
  <!-- Marcador Local (Rojo) -->
  <rect x="72" y="220" width="168" height="180" rx="20" fill="#000000" stroke="#1e293b" stroke-width="6"/>
  <text x="156" y="260" font-family="sans-serif" font-size="22" font-weight="800" fill="#94a3b8" text-anchor="middle">LOCAL</text>
  <text x="156" y="365" font-family="monospace" font-size="100" font-weight="900" fill="url(#scoreRed)" text-anchor="middle">84</text>
  
  <!-- Marcador Visitante (Verde) -->
  <rect x="272" y="220" width="168" height="180" rx="20" fill="#000000" stroke="#1e293b" stroke-width="6"/>
  <text x="356" y="260" font-family="sans-serif" font-size="22" font-weight="800" fill="#94a3b8" text-anchor="middle">VISIT</text>
  <text x="356" y="365" font-family="monospace" font-size="100" font-weight="900" fill="url(#scoreGreen)" text-anchor="middle">79</text>
  
  <!-- Posesión / Periodo -->
  <circle cx="256" cy="435" r="14" fill="#ef4444"/>
</svg>
